<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>VØRTEX - Nantes vs Guingamp</title>

  <!-- TAILWIND -->

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FONT -->

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap"
        rel="stylesheet">

  <!-- ICONS -->

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>

    html,
    body{
      margin:0;
      height:100%;
    }

    body{
      font-family:'Outfit',sans-serif;
      color:white;
      overflow-x:hidden;

      background:
      linear-gradient(
        135deg,
        rgba(10,10,12,.92) 0%,
        rgba(10,10,12,.88) 40%,
        rgba(10,10,12,.92) 100%
      ),
      url("https://thumb.canalplus.pro/http/unsafe/1440x810/filters:quality(80)/canalplus-cdn.canal-plus.io/p1/unit/31108766/canal-ouah_50061/STD169/myCANAL_16x9_sport_1920x1080-2026-03-20T160621.011-UIUD")
      center/cover no-repeat fixed;
    }

    /* GLASS */

    .glass{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(14px);
      box-shadow:0 30px 120px rgba(0,0,0,.75);
    }

    /* PLAYER */

    .player-box{
      position:relative;
      overflow:hidden;
      border-radius:22px;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
      display:block;
      background:black;
    }

    /* COVER */

    .cover{
      position:absolute;
      inset:0;
      z-index:20;
      cursor:pointer;

      background:
      linear-gradient(
        180deg,
        rgba(0,0,0,.15) 0%,
        rgba(0,0,0,.45) 55%,
        rgba(0,0,0,.82) 100%
      ),
      url("https://empire-sports.space/upload/events/7brtixsurh6rehohzfdn8v9i41uipe.jpg")
      center/cover no-repeat;
    }

    .pill{
      position:absolute;
      top:18px;
      right:18px;

      padding:8px 14px;

      border-radius:999px;

      background:rgba(0,0,0,.55);

      border:1px solid rgba(255,255,255,.12);

      display:flex;
      align-items:center;
      gap:8px;

      font-size:12px;
      font-weight:900;

      backdrop-filter:blur(12px);
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#f59e0b;
      box-shadow:0 0 0 4px rgba(245,158,11,.15);
    }

    .cover-strip{
      position:absolute;

      left:18px;
      right:18px;
      bottom:18px;

      height:85px;

      border-radius:18px;

      background:rgba(0,0,0,.42);

      border:1px solid rgba(255,255,255,.12);

      backdrop-filter:blur(18px);

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 20px;
    }

    .strip-title{
      font-size:18px;
      font-weight:900;
    }

    .strip-sub{
      margin-top:5px;
      font-size:14px;
      opacity:.82;
      font-style:italic;
      font-weight:700;
    }

    .strip-play{
      width:50px;
      height:50px;

      border-radius:999px;

      display:grid;
      place-items:center;

      background:rgba(255,255,255,.14);

      border:1px solid rgba(255,255,255,.16);

      transition:.2s;
    }

    .strip-play:hover{
      transform:scale(1.08);
    }

    /* BUTTONS */

    .source-btn{
      height:42px;
      padding:0 24px;

      border-radius:12px;

      font-weight:900;
      font-size:13px;

      transition:.2s;
    }

    .source-btn.active{
      background:white;
      color:black;
    }

    .source-btn.inactive{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:white;
    }

    /* WATCH BAR */

    .watch-bar{
      border-radius:18px;

      padding:14px 18px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }

    .watch-text .small{
      font-size:13px;
      opacity:.75;
      font-weight:700;
    }

    .watch-text .big{
      font-size:16px;
      font-weight:900;
      margin:3px 0;
    }

    .channel-logo{
      width:95px;
      object-fit:contain;
    }

    /* CHAT */

    .chat-box{
      border-radius:22px;
      overflow:hidden;

      min-height:520px;

      background:#0e0e10;

      border:1px solid rgba(255,255,255,.08);

      box-shadow:0 30px 120px rgba(0,0,0,.75);
    }

    .chat-head{
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:14px 16px;

      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .chat-head .title{
      font-weight:900;
    }

    .chat-head .sub{
      font-size:12px;
      opacity:.7;
      margin-top:2px;
      font-weight:700;
    }

    #chatFrame{
      position:relative;
      z-index:9999;
      width:100%;
      height:100%;
      border:none;
      background:#0e0e10;
    }

    @media(max-width:1024px){

      .chat-box{
        min-height:420px;
      }

    }

  </style>
</head>

<body>

  <!-- NAVBAR -->

  <nav class="sticky top-0 z-50 bg-black/30 backdrop-blur-xl border-b border-white/10">

    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">

      <div class="text-2xl md:text-3xl font-extrabold tracking-tight">
       VØRTEX 
      </div>

      <a href="index.html"
         class="inline-flex items-center gap-2 px-4 h-10 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 transition">

        <i class="fa-solid fa-arrow-left"></i>

        Retour

      </a>

    </div>

  </nav>

  <!-- MAIN -->

  <main class="max-w-screen-2xl mx-auto px-6 py-8">

    <section class="grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-6">

      <!-- PLAYER -->

      <div>

        <div class="player-box glass aspect-video">

          <!-- COVER -->

          <div id="cover"
               class="cover"
               onclick="loadVideo(1)">

            <div class="pill">
              <span class="dot"></span>
              LIVE 20:00
            </div>

            <div class="cover-strip">

              <div>

                <div class="strip-title">
                  Regarder Gratuitement
                </div>

                <div class="strip-sub">
                  Nantes vs Guingamp
                </div>

              </div>

              <div class="strip-play">
                <i class="fa-solid fa-play"></i>
              </div>

            </div>

          </div>

          <!-- VIDEO -->

          <div id="videoTarget"
               class="w-full h-full"></div>

        </div>

        <!-- BUTTONS -->

        <div class="mt-4 flex flex-wrap gap-3">

          <button id="btn1"
                  onclick="loadVideo(1)"
                  class="source-btn active">

            Source 1

          </button>

          <button id="btn2"
                  onclick="loadVideo(2)"
                  class="source-btn inactive">

            Source 2 HD

          </button>

        </div>

        <!-- WATCH BAR -->

        <div class="mt-5 watch-bar glass">

          <div class="watch-text">

            <div class="small">
              Vous regardez
            </div>

            <div class="big">
              Nantes vs Guingamp
            </div>

            <div class="small">
              Football · ligue 2
            </div>

          </div>

          <img class="channel-logo"
               src="https://empire-sports.space/upload/leagues/zzxgn4vec5jrrijw2jwjsgmscrtmir.png">

        </div>

      </div>

      <!-- CHAT -->

      <aside class="chat-box">

        <div class="chat-head">

          <div>

            <div class="title">
              Chat en direct
            </div>

            <div class="sub">
              Respectez les autres dans le chat
            </div>

          </div>

          <a href="https://www.twitch.tv/legamer_34500"
             target="_blank"
             class="text-xs font-extrabold px-3 h-9 inline-flex items-center rounded-full bg-white/10 border border-white/10 hover:bg-white/15">

            Ouvrir

          </a>

        </div>

        <div style="height:calc(100% - 60px);min-height:520px">

          <iframe id="chatFrame"></iframe>

        </div>

      </aside>

    </section>

  </main>

  <!-- SCRIPT -->

  <script>

    const SOURCES = {

      1:"https://jack13eo.mpgreatestclgczbmiddle.my/fr/football/french-ligue-2-4420837/guingamp-vs-fc-nantes.html?icg=RlI&ilang=fr",

      2:"https://jack13eo.mpgreatestclgczbmiddle.my/fr/football/french-ligue-2-4420837/guingamp-vs-fc-nantes.html?icg=RlI&ilang=fr",

    };

    // TWITCH CHAT

    (function(){

      const domain = window.location.hostname;

      document.getElementById("chatFrame").src =
      "https://www.twitch.tv/embed/vortexsupport/chat?parent=" + domain;

    })();

    // ACTIVE BUTTON

    function setActive(id){

      [1,2,3].forEach(function(n){

        const btn = document.getElementById("btn" + n);

        if(btn){

          btn.className =
          (n === id)
          ? "source-btn active"
          : "source-btn inactive";

        }

      });

    }

    // LOAD VIDEO

    function loadVideo(id){

      const cover = document.getElementById("cover");

      if(cover){
        cover.style.display = "none";
      }

      setActive(id);

      const target = document.getElementById("videoTarget");

      const url = SOURCES[id];

      // NO STREAM

      if(!url || url === "#"){

        target.innerHTML = `

          <div style="
            width:100%;
            height:100%;
            display:grid;
            place-items:center;
            font-size:24px;
            font-weight:900;
            color:rgba(255,255,255,.7);
          ">

            Le stream arrive bientôt 😉

          </div>

        `;

        return;

      }

      // LOAD STREAM

      target.innerHTML = `

        <iframe
          src="${url}"
          allowfullscreen
          scrolling="no"
          frameborder="0"
          allow="autoplay; fullscreen; picture-in-picture"
          referrerpolicy="no-referrer-when-downgrade"
          sandbox="allow-forms allow-scripts allow-same-origin allow-presentation"
          style="width:100%;height:100%;border:0">
        </iframe>

      `;

    }

  </script>

</body>
</html>
