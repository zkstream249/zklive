:root {

  --bg: #06060a;
}
* { font-family: 'Outfit', sans-serif; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: #fff;
  overflow-x: hidden;
  cursor: none;
}
a, button, input { cursor: none; }
@media (pointer: coarse) {
  .cursor-dot, .cursor-ring { display: none !important; }
  body, a, button, input { cursor: auto; }
}

.cursor-dot, .cursor-ring {
  position: fixed; top: 0; left: 0; pointer-events: none; z-index: 10000;
  border-radius: 50%; transform: translate(-50%, -50%);
}
.cursor-dot {
  width: 8px; height: 8px; background: var(--brand); box-shadow: 0 0 16px var(--brand);
}
.cursor-ring {
  width: 36px; height: 36px; border: 1.5px solid rgba(168,85,247,.55);
  transition: width .25s, height .25s, border-color .25s, background .25s;
}
.cursor-ring.hover {
  width: 56px; height: 56px;
  border-color: rgba(168,85,247,.9);
  background: rgba(168,85,247,.08);
}

.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.scene-img {
  position: absolute; inset: 0;
  background:

    radial-gradient(ellipse at 50% 0%, rgba(168,85,247,.22) 0%, transparent 55%),

  animation: kenburns 28s ease-in-out infinite alternate;
}
@keyframes kenburns {
  from { transform: scale(1); }
  to { transform: scale(1.08) translateY(-2%); }
}
.orb {
  position: absolute; border-radius: 50%; filter: blur(80px); opacity: .4;
  animation: floatOrb 12s ease-in-out infinite;
}
.orb-a { width: 420px; height: 420px; background: #a855f7; top: -10%; left: -8%; }
.orb-b { width: 360px; height: 360px; background: #4f46e5; top: 35%; right: -10%; animation-delay: -4s; }
@keyframes floatOrb {
  0%, 100% { transform: translate(0,0); }
  50% { transform: translate(40px,-30px) scale(1.1); }
}
#particles { position: absolute; inset: 0; width: 100%; height: 100%; }
.vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.65) 100%);
}

.glass {
  background: rgba(14,14,20,.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.08);

@keyframes pulse-dot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.25); opacity: .7; }

.live-dot { animation: pulse-dot 1.6s ease-out infinite; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: none; }
}
.reveal { opacity: 0; animation: fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; }

.d2 { animation-delay: .16s; }

<script>
(function () {
  const bar = document.getElementById('nbar');
  let p = 0;
  const tick = () => {
    p = Math.min(p + Math.random() * 18, 92);
    bar.style.width = p + '%';
    if (p < 92) requestAnimationFrame(() => setTimeout(tick, 80));
  };
  tick();
  window.addEventListener('load', () => {
    bar.style.width = '100%';
    setTimeout(() => { bar.style.opacity = '0'; }, 350);
  });
})();

(function () {
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  if (!window.matchMedia('(pointer:fine)').matches) return;
  let x = 0, y = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', (e) => { x = e.clientX; y = e.clientY; dot.style.left = x + 'px'; dot.style.top = y + 'px'; });
  (function follow() {
    rx += (x - rx) * 0.18; ry += (y - ry) * 0.18;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(follow);
  })();
  document.addEventListener('mouseover', (e) => {
    if (e.target.closest('.interactive')) ring.classList.add('hover');
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest('.interactive')) ring.classList.remove('hover');
  });
})();

(function () {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let w, h, parts = [];
  function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
  function spawn() {
    parts = Array.from({ length: Math.min(55, Math.floor(w / 24)) }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.6 + 0.4,
      vx: (Math.random() - 0.5) * 0.3, vy: -Math.random() * 0.35 - 0.08,
      a: Math.random() * 0.4 + 0.1, hue: Math.random() > 0.7 ? 160 : 270
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue},80%,70%,${p.a})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  resize(); spawn(); draw();
  addEventListener('resize', () => { resize(); spawn(); });
})();

  { name: "M6", logo: "https://upload.wikimedia.org/wikipedia/fr/thumb/2/22/M6_logo_2015.svg/200px-M6_logo_2015.svg.png", cat: "Sport" }
];

const FAV_KEY = 'huni_tv_favs_v1';
let currentTab = 'all';

function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch { return []; }
}
function setFavs(list) {
  localStorage.setItem(FAV_KEY, JSON.stringify(list));
  document.getElementById('favCount').textContent = list.length;
}

function cardHTML(ch, i, isFav) {
  const href = `stream.html?c=${encodeURIComponent(ch.name)}`;
  return `
  <a href="${href}" class="channel-tile interactive" style="--i:${i}" data-name="${ch.name}">
    <div class="channel-tile__head">
      <button type="button" class="channel-tile__fav ${isFav ? 'is-on' : ''}" data-fav="${ch.name}" aria-label="Favori">
        <svg viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3.5l2.6 5.3 5.9.9-4.3 4.2 1 5.8L12 16.9 6.8 19.7l1-5.8L3.5 9.7l5.9-.9L12 3.5z"/></svg>
      </button>
    </div>
    <div class="channel-tile__logo-pane">
      <div class="channel-tile__logo-inner">
        <img src="${ch.logo}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity='.3'">
      </div>
    </div>
    <div class="channel-tile__foot">
      <p class="channel-tile__name">${ch.name}</p>
      <p class="channel-tile__now">Programme indisponible</p>
      <div class="channel-tile__meta">
        <span class="channel-tile__chip">${ch.cat}</span>
        <span class="channel-tile__chip channel-tile__chip--hd">FHD</span>
        <span class="channel-tile__chip channel-tile__chip--lang">FR</span>
      </div>
    </div>
  </a>`;
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  const favs = getFavs();
  let list = CHANNELS.filter(c => c.name.toLowerCase().includes(q));
  if (currentTab === 'favs') list = list.filter(c => favs.includes(c.name));

  document.getElementById('countLabel').textContent = `${list.length} disponible${list.length > 1 ? 's' : ''}`;
  document.getElementById('favCount').textContent = favs.length;

  const grid = document.getElementById('channelsGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="col-span-full glass p-10 rounded-2xl text-center text-gray-400 text-sm" style="grid-column:1/-1">Aucune chaîne trouvée.</div>`;
    return;
  }
  grid.innerHTML = list.map((c, i) => cardHTML(c, i, favs.includes(c.name))).join('');
}

document.getElementById('channelsGrid').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-fav]');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const name = btn.getAttribute('data-fav');
  let favs = getFavs();
  if (favs.includes(name)) favs = favs.filter(n => n !== name);
  else favs.push(name);
  setFavs(favs);
  render();
});

document.getElementById('search').addEventListener('input', render);
document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTab = btn.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
});
document.getElementById('refreshBtn').addEventListener('click', () => {
  const icon = document.getElementById('refreshIcon');
  icon.style.transform = 'rotate(360deg)';
  setTimeout(() => { icon.style.transform = ''; }, 500);
  render();
});

setFavs(getFavs());
render();
</script>
</body>
</html>
