<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ZFMA - Crystal Palace vs Vallecano</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Outfit',sans-serif;
      color:white;
      overflow-x:hidden;
      min-height:100vh;
      background:
      linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
      url('https://images.unsplash.com/photo-1547347298-4074fc3086f0?q=80&w=2070&auto=format&fit=crop') center/cover fixed;
    }

    .glass{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(18px);
      box-shadow:0 20px 80px rgba(0,0,0,.55);
    }

    .player-box{
      border-radius:24px;
      overflow:hidden;
      position:relative;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
    }

    .cover{
      position:absolute;
      inset:0;
      z-index:20;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:20px;
      background:
      linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.85)),
      url('https://empire-sports.online/upload/events/n9dynlk4at8hddbhsouhntl492chr5.jpg') center/cover;
    }

    .play-btn{
      width:90px;
      height:90px;
      border-radius:999px;
      background:white;
</html>
