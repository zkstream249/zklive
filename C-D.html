<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZFMA X Neon</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Outfit',sans-serif;
background:#050507;
color:white;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at top right,rgba(255,0,85,.15),transparent 30%),
radial-gradient(circle at bottom left,rgba(124,58,237,.15),transparent 30%);
pointer-events:none;
}

.glass{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
box-shadow:0 10px 60px rgba(0,0,0,.5);
}

.hero{
height:100vh;
padding:30px;
display:grid;
grid-template-columns:1fr 420px;
gap:25px;
}

.player{
position:relative;
border-radius:35px;
overflow:hidden;
}

.player iframe{
width:100%;
height:100%;
border:0;
}

.overlay{
position:absolute;
inset:0;
z-index:5;
display:flex;
flex-direction:column;
justify-content:space-between;
padding:35px;
background:
linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.85)),
url('https://images.unsplash.com/photo-1547347298-4074fc3086f0?q=80&w=2070&auto=format&fit=crop') center/cover;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
}

.live{
background:#ff004c;
padding:12px 18px;
border-radius:999px;
font-weight:900;
display:flex;
align-items:center;
gap:10px;
}

.dot{
width:10px;
height:10px;
border-radius:999px;
background:white;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{opacity:1}
50%{opacity:.3}
100%{opacity:1}
}

.play{
width:110px;
height:110px;
border-radius:999px;
background:rgba(255,255,255,.15);
border:1px solid rgba(255,255,255,.15);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
margin:auto;
cursor:pointer;
transition:.3s;
}

.play:hover{
transform:scale(1.08);
background:white;
color:black;
}

.teams{
display:flex;
align-items:center;
gap:20px;
font-size:42px;
font-weight:900;
flex-wrap:wrap;
}

.stats{
display:flex;
gap:15px;
margin-top:20px;
flex-wrap:wrap;
}

.stat{
padding:14px 18px;
border-radius:18px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.08);
font-weight:800;
}

.chat{
border-radius:35px;
overflow:hidden;
display:flex;
flex-direction:column;
height:100%;
}

.chat-head{
padding:22px;
border-bottom:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-between;
align-items:center;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.message{
display:flex;
gap:12px;
}

.avatar{
width:42px;
height:42px;
border-radius:999px;
background:linear-gradient(135deg,#ff004c,#7c3aed);
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
}

.bubble{
background:rgba(255,255,255,.06);
padding:12px 14px;
border-radius:18px;
max-width:100%;
}

.input{
padding:18px;
border-top:1px solid rgba(255,255,255,.08);
display:flex;
gap:12px;
}

.input input{
flex:1;
height:55px;
border-radius:16px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
padding:0 16px;
color:white;
outline:none;
}

.input button{
width:60px;
border-radius:16px;
background:white;
color:black;
font-size:18px;
font-weight:900;
}

.sources{
display:flex;
gap:15px;
padding:25px 0;
flex-wrap:wrap;
}

.source{
height:55px;
padding:0 24px;
border-radius:18px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
font-weight:900;
transition:.3s;
}

.source:hover{
transform:translateY(-3px);
background:white;
color:black;
}

@media(max-width:1100px){
.hero{
grid-template-columns:1fr;
height:auto;
}

.chat{
height:700px;
}

.teams{
font-size:28px;
}
}
</style>
</head>

<body>

<div class="hero">

<div>

<div class="player glass">

<div class="overlay" id="overlay">

<div class="topbar">
<div class="live">
<div class="dot"></div>
LIVE
</div>

<div class="stat">
<i class="fa-solid fa-users"></i>
<span id="viewers">0</span>
</div>
</div>

<div class="play" onclick="playStream()">
<i class="fa-solid fa-play"></i>
</div>

<div>
<div style="opacity:.7;font-weight:700;margin-bottom:10px">FOOTBALL • HD STREAM</div>

<div class="teams">
<span>Crystal Palace</span>
<span style="opacity:.4">VS</span>
<span>Vallecano</span>
</div>

<div class="stats">
<div class="stat">1080P</div>
<div class="stat">Ultra Low Delay</div>
<div class="stat">Realtime Chat</div>
</div>
</div>

</div>

<div id="video"></div>

</div>

<div class="sources">
<button class="source" onclick="changeSource(1)">Source 1</button>
<button class="source" onclick="changeSource(2)">Source HD</button>
<button class="source" onclick="changeSource(3)">Backup</button>
</div>

</div>

<div class="chat glass">

<div class="chat-head">
<div>
<div style="font-size:22px;font-weight:900">Live Chat</div>
<div style="opacity:.6;font-size:14px">Supporters en direct</div>
</div>

<div class="live">
<div class="dot"></div>
ONLINE
</div>
</div>

<div class="messages" id="messages"></div>

<div class="input">
<input id="messageInput" placeholder="Envoyer un message...">
<button onclick="sendMessage()">
<i class="fa-solid fa-paper-plane"></i>
</button>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';

import {
getDatabase,
ref,
push,
onChildAdded,
set,
onDisconnect,
onValue
} from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js';

const firebaseConfig={
apiKey:'YOUR_API_KEY',
authDomain:'YOUR_PROJECT.firebaseapp.com',
databaseURL:'YOUR_DATABASE_URL',
projectId:'YOUR_PROJECT_ID',
storageBucket:'YOUR_PROJECT.appspot.com',
messagingSenderId:'YOUR_SENDER_ID',
appId:'YOUR_APP_ID'
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const username='Fan'+Math.floor(Math.random()*9999);
const userId=crypto.randomUUID();

const messagesRef=ref(db,'zfma-chat');
const viewersRef=ref(db,'zfma-viewers/'+userId);

set(viewersRef,{online:true});
onDisconnect(viewersRef).remove();

onValue(ref(db,'zfma-viewers'),snap=>{
const count=snap.exists()?Object.keys(snap.val()).length:0;
document.getElementById('viewers').innerText=count;
});

window.sendMessage=function(){
const input=document.getElementById('messageInput');
const text=input.value.trim();

if(!text) return;

push(messagesRef,{
username,
text,
time:Date.now()
});

input.value='';
}

onChildAdded(messagesRef,snap=>{
const data=snap.val();

const div=document.createElement('div');
div.className='message';

const letter=data.username.charAt(0).toUpperCase();

const time=new Date(data.time).toLocaleTimeString('fr-FR',{
hour:'2-digit',
minute:'2-digit'
});

div.innerHTML=`
<div class="avatar">${letter}</div>
<div class="bubble">
<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
<div style="font-weight:900">${data.username}</div>
<div style="font-size:11px;opacity:.5">${time}</div>
</div>
<div>${data.text}</div>
</div>
`;

const container=document.getElementById('messages');
container.appendChild(div);
container.scrollTop=container.scrollHeight;
});
</script>

<script>

const sources={
1:'https://livewatch.top/embed/3271278010f4217cd17c4c-9481045a45a7d7',
2:'https://livewatch.top/embed/3271278010f4217cd17c4c-9481045a45a7d7',
3:'https://livewatch.top/embed/3271278010f4217cd17c4c-9481045a45a7d7'
};

function playStream(){
changeSource(1);
document.getElementById('overlay').style.display='none';
}

function changeSource(id){
document.getElementById('video').innerHTML=`
<iframe
src="${sources[id]}"
allowfullscreen
allow="autoplay; fullscreen"
></iframe>
`;
}

</script>

</body>
</html>
