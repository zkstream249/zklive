<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>

<title>ZFMA - Live</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

body{
  margin:0;
  font-family:'Outfit',sans-serif;
  background:#070709;
  color:white;
}

.glass{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
}

.player{
  position:relative;
  overflow:hidden;
  border-radius:22px;
  aspect-ratio:16/9;
}

#videoTarget{
  width:100%;
  height:100%;
  background:black;
}

.cover{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.65);
  cursor:pointer;
}

.cover button{
  padding:14px 26px;
  background:#ff2d55;
  border:none;
  border-radius:14px;
  color:white;
  font-weight:900;
  font-size:14px;
}

.btns{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.source-btn{
  padding:10px 16px;
  border-radius:12px;
  font-weight:800;
  font-size:13px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  cursor:pointer;
}

.source-btn.active{
  background:white;
  color:black;
}

.chat{
  height:100%;
  border-radius:22px;
  overflow:hidden;
  background:black;
}

.chat-header{
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.live{
  color:#ff3b3b;
  font-weight:900;
  font-size:12px;
}

iframe{
  width:100%;
  height:100%;
  border:0;
  background:black;
}

.layout{
  display:grid;
  grid-template-columns:1fr 380px;
  gap:18px;
  padding:20px;
}

@media(max-width:1000px){
  .layout{grid-template-columns:1fr}
}

.topbar{
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
}

</style>
</head>

<body>

<div class="topbar">
  <div style="font-weight:900;font-size:20px;">ZFMA</div>
  <div style="opacity:.6;font-size:13px;">LIVE STREAM</div>
</div>

<div class="layout">

  <!-- PLAYER -->
  <div>

    <div class="player glass">

      <div id="videoTarget"></div>

      <div class="cover" id="cover" onclick="loadVideo(1)">
        <button>▶ Lancer le stream</button>
      </div>

    </div>

    <div class="btns">

      <button id="btn1" class="source-btn active" onclick="loadVideo(1)">Source 1</button>
      <button id="btn2" class="source-btn" onclick="loadVideo(2)">Source 2</button>
      <button id="btn3" class="source-btn" onclick="loadVideo(3)">Source 3</button>

    </div>

  </div>

  <!-- CHAT -->
  <div class="chat glass">

    <div class="chat-header">
      <div style="font-weight:900;">Chat Live</div>
      <div class="live">● LIVE</div>
    </div>

    <div style="height:600px">

      <!-- CHATANGO (SANS COMPTE) -->
      <script id="cid0020000"
              data-cfasync="false"
              src="https://st.chatango.com/js/gz/emb.js"
              style="width:100%;height:100%;">
      {
        "handle":"zfma_livechat",
        "arch":"js",
        "styles":{
          "a":"000000",
          "b":100,
          "c":"FFFFFF",
          "d":"FFFFFF",
          "e":"000000",
          "f":100,
          "g":"ff2d55",
          "h":"000000",
          "k":"000000",
          "l":"000000",
          "m":"000000",
          "n":"FFFFFF",
          "p":"10",
          "q":"000000",
          "r":100
        }
      }
      </script>

    </div>

  </div>

</div>

<script>

const SOURCES = {
  1:"https://livewatch.top/embed/3271278010f4217cd17c4c",
  2:"https://livewatch.top/embed/3271278010f4217cd17c4c",
  3:"#"
};

function setActive(n){
  [1,2,3].forEach(i=>{
    document.getElementById("btn"+i).classList.remove("active");
  });
  document.getElementById("btn"+n).classList.add("active");
}

function loadVideo(id){

  document.getElementById("cover").style.display="none";

  setActive(id);

  const url = SOURCES[id];
  const target = document.getElementById("videoTarget");

  if(!url || url==="#"){
    target.innerHTML = "<div style='display:grid;place-items:center;height:100%;background:black'>Stream bientôt dispo</div>";
    return;
  }

  target.innerHTML = `
    <iframe src="${url}" allowfullscreen></iframe>
  `;
}

</script>

</body>
</html>
