<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ZFMA - Crystal Palace vs Vallecano</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Outfit',sans-serif;
      color:white;
      overflow-x:hidden;
      min-height:100vh;
      background:
      linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
      url('https://images.unsplash.com/photo-1547347298-4074fc3086f0?q=80&w=2070&auto=format&fit=crop') center/cover fixed;
    }

    .glass{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(18px);
      box-shadow:0 20px 80px rgba(0,0,0,.55);
    }

    .player-box{
      border-radius:24px;
      overflow:hidden;
      position:relative;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
    }

    .cover{
      position:absolute;
      inset:0;
      z-index:20;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:20px;
      background:
      linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.85)),
      url('https://empire-sports.online/upload/events/n9dynlk4at8hddbhsouhntl492chr5.jpg') center/cover;
    }

    .play-btn{
      width:90px;
      height:90px;
      border-radius:999px;
      background:white;
      color:black;
      display:grid;
      place-items:center;
      font-size:32px;
      transition:.25s;
    }

    .play-btn:hover{
      transform:scale(1.08);
    }

    .source-btn{
      height:46px;
      padding:0 20px;
      border-radius:14px;
      font-weight:900;
      transition:.2s;
    }

    .active-source{
      background:white;
      color:black;
    }

    .inactive-source{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.08);
      color:white;
    }

    .chat-box{
      height:780px;
      border-radius:24px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .chat-messages{
      flex:1;
      overflow-y:auto;
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .message{
      display:flex;
      gap:8px;
      word-break:break-word;
      animation:fade .25s ease;
    }

    @keyframes fade{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }

    .user{
      font-weight:900;
      color:#a855f7;
    }

    .chat-input{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.08);
      color:white;
      border-radius:14px;
      height:48px;
      padding:0 16px;
      outline:none;
    }

    .send-btn{
      background:#9333ea;
      border-radius:14px;
      font-weight:900;
      padding:0 22px;
      transition:.2s;
    }

    .send-btn:hover{
      background:#a855f7;
    }

    @media(max-width:1024px){
      .chat-box{
        height:500px;
      }
    }
  </style>
</head>

<body>

<nav class="sticky top-0 z-50 bg-black/30 backdrop-blur-xl border-b border-white/10">
  <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">

    <div class="text-3xl font-black tracking-tight">
      ZFMA
    </div>

    <a href="index.html"
      class="h-11 px-5 rounded-full bg-white/10 border border-white/10 hover:bg-white/15 inline-flex items-center gap-2 font-bold">
      <i class="fa-solid fa-arrow-left"></i>
      Retour
    </a>

  </div>
</nav>

<main class="max-w-screen-2xl mx-auto p-6">

  <section class="grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-6">

    <div>

      <div class="player-box glass aspect-video">

        <div class="cover" id="cover" onclick="loadVideo(1)">
          <div class="text-5xl font-black text-center">
            Crystal Palace VS Vallecano
          </div>

          <div class="play-btn">
            <i class="fa-solid fa-play"></i>
          </div>

          <div class="text-xl font-bold opacity-90">
            Regarder le match gratuitement
          </div>
        </div>

        <div id="videoTarget" class="w-full h-full"></div>

      </div>

      <div class="flex flex-wrap gap-3 mt-5">

        <button id="btn1" onclick="loadVideo(1)" class="source-btn active-source">
          Source 1
        </button>

        <button id="btn2" onclick="loadVideo(2)" class="source-btn inactive-source">
          Source 2 HD
        </button>

        <button id="btn3" onclick="loadVideo(3)" class="source-btn inactive-source">
          Source 3
        </button>

      </div>

      <div class="glass rounded-3xl p-5 mt-5 flex items-center justify-between">

        <div>
          <div class="text-sm opacity-70 font-bold">Vous regardez</div>
          <div class="text-2xl font-black mt-1">Crystal Palace - Vallecano</div>
          <div class="text-sm opacity-70 mt-1">Foot • 21:00</div>
        </div>

        <div class="text-right">
          <div class="text-sm opacity-70">Viewers</div>
          <div class="text-3xl font-black text-red-500" id="viewerCount">0</div>
        </div>

      </div>

    </div>

    <aside class="chat-box glass">

      <div class="border-b border-white/10 p-4 flex items-center justify-between">

        <div>
          <div class="font-black text-lg">Chat en direct</div>
          <div class="text-sm opacity-70">Tout le monde peut parler</div>
        </div>

        <div class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-xs font-black">
          LIVE
        </div>

      </div>

      <div id="chatMessages" class="chat-messages"></div>

      <div class="p-4 border-t border-white/10 flex flex-col gap-3">

        <input
          id="username"
          type="text"
          placeholder="Ton pseudo"
          class="chat-input"
        />

        <div class="flex gap-2">

          <input
            id="chatInput"
            type="text"
            placeholder="Écris un message..."
            class="chat-input flex-1"
          />

          <button onclick="sendMessage()" class="send-btn">
            <i class="fa-solid fa-paper-plane"></i>
          </button>

        </div>

      </div>

    </aside>

  </section>

</main>

<script>
  const SOURCES = {
    1:'https://livewatch.top/embed/3271278010f4217cd17c4c-9481045a45a7d7',
    2:'https://jack49eo.mp7786j2ncsusov57general.ru/fr/football/uefa-europa-conference-league-4396136/crystal-palace-vs-rayo-vallecano.html?icg=RlI&ilang=fr',
    3:'#'
  };

  function setActive(id){

    [1,2,3].forEach(n=>{

      const btn=document.getElementById('btn'+n);

      btn.className=(n===id)
      ?'source-btn active-source'
      :'source-btn inactive-source';

    });
  }

  function loadVideo(id){

    document.getElementById('cover').style.display='none';

    setActive(id);

    const target=document.getElementById('videoTarget');

    const url=SOURCES[id];

    if(url==='#'){
      target.innerHTML=`
      <div style="width:100%;height:100%;display:grid;place-items:center;font-weight:900">
        Source bientôt disponible
      </div>`;
      return;
    }

    target.innerHTML=`
      <iframe
        src="${url}"
        allowfullscreen
        allow="autoplay; fullscreen; picture-in-picture"
        sandbox="allow-scripts allow-same-origin allow-presentation"
      ></iframe>
    `;
  }

  setInterval(()=>{

    const viewer=document.getElementById('viewerCount');

    let current=parseInt(viewer.innerText);

    const random=Math.floor(Math.random()*8)-3;

    viewer.innerText=current+random;

  },3000);
</script>

<script type="module">

  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';

  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  }
  from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: 'TON_API_KEY',
    authDomain: 'TON_PROJET.firebaseapp.com',
    projectId: 'TON_PROJECT_ID',
    storageBucket: 'TON_PROJET.appspot.com',
    messagingSenderId: 'XXXXXXXX',
    appId: 'TON_APP_ID'
  };

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const messagesBox = document.getElementById('chatMessages');

  const chatInput = document.getElementById('chatInput');

  const usernameInput = document.getElementById('username');

  async function sendMessage(){

    const text=chatInput.value.trim();

    const username=usernameInput.value.trim() || 'Anonyme';

    if(!text) return;

    await addDoc(collection(db,'messages'),{
      username,
      text,
      createdAt:serverTimestamp()
    });

    chatInput.value='';
  }

  window.sendMessage=sendMessage;

  chatInput.addEventListener('keydown',e=>{
    if(e.key==='Enter') sendMessage();
  });

  const q=query(collection(db,'messages'),orderBy('createdAt'));

  onSnapshot(q,(snapshot)=>{

    messagesBox.innerHTML='';

    snapshot.forEach((doc)=>{

      const data=doc.data();

      const message=document.createElement('div');

      message.className='message';

      message.innerHTML=`
        <span class="user">${data.username}</span>
        <span>${data.text}</span>
      `;

      messagesBox.appendChild(message);

    });

    messagesBox.scrollTop=messagesBox.scrollHeight;

  });

</script>

</body>
</html>
