<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HUNI Stream</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #090510;
      font-family: 'Outfit', sans-serif;
      color: white;
      overflow-x: hidden;
    }

    /* Container global adaptatif */
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1400px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 12px;
    }

    @media (min-width: 768px) {
      .app-container {
        padding: 24px;
        justify-content: center;
      }
    }

    /* Bouton Retour propre */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(139, 92, 246, 0.25);
      color: white;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      width: fit-content;
      margin-bottom: 12px;
    }

    .back-btn:hover, .back-btn:active {
      background: rgba(139, 92, 246, 0.25);
      border-color: rgba(139, 92, 246, 0.6);
      transform: translateY(-2px);
    }

    /* Cadre vidéo responsive (16:9) */
    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #110a1f;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(139, 92, 246, 0.25);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.15);
    }

    @media (min-width: 768px) {
      .player-wrapper {
        border-radius: 24px;
      }
    }

    /* Couverture / Play */
    .cover {
      position: absolute;
      inset: 0;
      z-index: 10;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(9, 5, 16, 0.3) 0%, rgba(9, 5, 16, 0.85) 100%),
                  url("https://thumb.canalplus.pro/http/unsafe/2880x1620/filters:quality(80)/mht.images.prod.siec.canal.aws.io-cplus.net/program/1321229/120/1321229_120-2b87522c-1092-4034-a072-04c46ff1931e.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .play-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #8b5cf6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
